<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Rating Component</title>
  </head>
  <body>
    <div class="container">
      <div class="card bg-light rounded-3 border-0 shadow-lg mt-5">
        <div class="card-body">
          <div class="row">
            <div class="col-7">
              <h2>What Others Think About The Product</h2>
            </div>
            <div class="col-5">
              <div class="card">
                <div class="card-body text-center">
                  <h3 class="display-5 fw-semibold">
                    <i class="fas fa-star text-warning"></i> 4.8
                  </h3>
                  <p>Average Rating</p>
                </div>
              </div>
            </div>
          </div>
          <div class="row p-3">
            <div class="col-12">
              <div class="input-group input-group-lg">
                <span class="input-group-text" id="inputGroup-sizing-lg"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control" placeholder="Search reviews" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-lg">
              </div>
            </div>
          </div>
          <div class="row p-5">
            <div class="col-12">
              <h2>Ratings</h2>
              
              <div class="d-flex align-items-center mb-2">
                <span class="me-3" style="width: 60px;">5 stars</span>
                <div class="progress flex-grow-1" style="height: 10px;">
                  <div class="progress-bar bg-warning" role="progressbar" style="width: 80%;" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <span class="ms-3 text-muted">80%</span>
              </div>

              <div class="d-flex align-items-center mb-2">
                <span class="me-3" style="width: 60px;">4 stars</span>
                <div class="progress flex-grow-1" style="height: 10px;">
                  <div class="progress-bar bg-warning" role="progressbar" style="width: 60%;" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <span class="ms-3 text-muted">60%</span>
              </div>

              <div class="d-flex align-items-center mb-2">
                <span class="me-3" style="width: 60px;">3 stars</span>
                <div class="progress flex-grow-1" style="height: 10px;">
                  <div class="progress-bar bg-warning" role="progressbar" style="width: 20%;" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <span class="ms-3 text-muted">20%</span>
              </div>

              <div class="d-flex align-items-center mb-2">
                <span class="me-3" style="width: 60px;">2 stars</span>
                <div class="progress flex-grow-1" style="height: 10px;">
                  <div class="progress-bar bg-warning" role="progressbar" style="width: 10%;" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <span class="ms-3 text-muted">10%</span>
              </div>

              <div class="d-flex align-items-center">
                <span class="me-3" style="width: 60px;">1 star</span>
                <div class="progress flex-grow-1" style="height: 10px;">
                  <div class="progress-bar bg-warning" role="progressbar" style="width: 27%;" aria-valuenow="27" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <span class="ms-3 text-muted">27%</span>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
